  #  healthcheck:
  #    test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
  #    interval: 10s
  #    timeout: 5s
  #    retries: 5

  app:
    image: ${DOCKER_USERNAME}/spotify-copy:latest
    ports:
      - "443:8443"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create
      - ADMIN_PASS=${ADMIN_PASS}
      - MARKETING_PASS=${MARKETING_PASS}
      - SUBSCRIBER_PASS_1=${SUBSCRIBER_PASS_1}
      - SUBSCRIBER_PASS_2=${SUBSCRIBER_PASS_2}
      - PROJECT_MANAGER=${PROJECT_MANAGER}
      - FINANCE_PASSWORD=${FINANCE_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - SSL_KEYSTORE=/app/keystore.p12
      - LOGGING_FILE_NAME=/app/logs/application.log
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - PII_ENCRYPTION_KEY=${PII_ENCRYPTION_KEY}


    volumes:
      - app-uploads:/app/uploads
      - /var/log/myapp:/app/logs
      - ./keystore.p12:/app/keystore.p12:ro
    #depends_on:
    #  db:
    #    condition: service_healthy
    restart: unless-stopped


volumes:
  app-uploads:
  app-logs:

