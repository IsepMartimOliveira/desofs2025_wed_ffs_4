##
## Logging
##
logging.level.com.example.demo=DEBUG
logging.level.org.springframework=DEBUG
# ...existing code...

# TLS/SSL connection logging
logging.level.javax.net.ssl=DEBUG
logging.level.sun.security.ssl=DEBUG
logging.level.org.apache.tomcat.util.net=DEBUG
logging.level.org.apache.coyote.http11=DEBUG


##
## Profiles
##
spring.profiles.active=bootstrap,local

server.ssl.key-store=${SSL_KEYSTORE}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.keyStoreType=PKCS12
server.ssl.keyAlias=baeldung
server.ssl.enabled=true
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.port=8443

### Session Timout
server.servlet.session.timeout=15m
security.login.max-attempts=5
security.login.max-attempts-ip=20
security.login.lock-duration-seconds=300
security.login.ip-block-duration-seconds=300
account.creation.max-attempts=50
