##
## OpenAPI
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT
##

jwt.private.key=${JWT_PRIVATE_KEY}
jwt.public.key=${JWT_PUBLIC_KEY}

##
## PII Encryption (ASVS Compliance)
##
# Base64-encoded AES-256 encryption key for PII data at rest
# In production, this should be stored in a secure vault or HSM
app.encryption.key=${PII_ENCRYPTION_KEY:}
app.encryption.algorithm=AES
app.encryption.transformation=AES/GCM/NoPadding
app.encryption.iv-length=12
app.encryption.tag-length=128
app.encryption.key-length=256

token.timeout=3600
##
## datasource
##

##H2
spring.h2.console.enabled=true



spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.path=/h2
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sqp=true



## database schema generation
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true


##
## H2 console for development purposes. e.g., http://localhost:8080/h2-console
##
## for security reasons this setting should be false

##
## MULTIPART (MultipartProperties)
##
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

##
## File Storage Properties
##
# All files uploaded through the REST API will be stored in this directory
#file.upload-dir=/Users/ASUS/Documents/PSOFT/dev
file.upload-dir=./uploads
