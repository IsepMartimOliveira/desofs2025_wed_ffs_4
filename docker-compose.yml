services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      #- USER_ADMIN_PASSWORD=${ADMIN_PASSWORD}
      #- USER_MARKETING_PASSWORD=${MARKETING_PASSWORD}
      #- USER_SUBSCRIBER_TOMAS=${SUBSCRIBER_TOMAS_PASSWORD}
      #- USER_SUBSCRIBER_ALEX=${SUBSCRIBER_ALEX_PASSWORD}
      #- USER_PROJECT_MANAGER_PASSWORD=${PROJECT_MANAGER_PASSWORD}
      #- USER_FINANCE_PASSWORD=${FINANCE_PASSWORD}
      #- USER_TEST_CHICO=${TEST_CHICO_PASSWORD}
      #- JWT_PRIVATE_KEY_PATH=/app/keys/rsa.private.key
      #- JWT_PUBLIC_KEY_PATH=/app/keys/rsa.public.key
    volumes:
      - app-uploads:/app/uploads
      #- ./keys:/app/keys:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  app-uploads:
  db-data: