name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE_NAME: 'spotify-copy'

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Docker Scout analysis
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          only-severities: critical,high
          exit-code: '1'

      # If we get here, scans passed, so build and push to registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.release.tag_name || 'release' }}
  deploy-backend-azure:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        run:
          echo "${{ secrets.AZURE_SSH_PRIV_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Create .env file from secrets
        run: |
            echo 'DB_NAME=${{ secrets.DB_NAME }}' >> .env
            echo 'DB_USERNAME=${{ secrets.DB_USERNAME }}' >> .env
            echo 'DB_PASSWORD=${{ secrets.DB_PASSWORD }}' >> .env
            echo 'DB_URL=${{ secrets.DB_URL }}' >> .env
            echo 'ADMIN_PASS=${{ secrets.ADMIN_PASS }}' >> .env
            echo 'MARKETING_PASS=${{ secrets.MARKETING_PASS }}' >> .env
            echo 'SUBSCRIBER_PASS_1=${{ secrets.SUBSCRIBER_PASS_1 }}' >> .env
            echo 'SUBSCRIBER_PASS_2=${{ secrets.SUBSCRIBER_PASS_2 }}' >> .env
            echo 'PROJECT_MANAGER=${{ secrets.PROJECT_MANAGER }}' >> .env
            echo 'FINANCE_PASSWORD=${{ secrets.FINANCE_PASSWORD }}' >> .env
            echo 'JWT_PRIVATE_KEY="${{ secrets.JWT_PRIVATE_KEY }}"' >> .env
            echo 'JWT_PUBLIC_KEY="${{ secrets.JWT_PUBLIC_KEY }}"' >> .env
      - name: Add private key to SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
           ssh-private-key: ${{ secrets.AZURE_SSH_PRIV_KEY }}
      - name: Copy docker-compose.yml to Azure VM
        run: |
            scp -o StrictHostKeyChecking=no docker-compose.yml \
            ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_HOST_VM }}:/home/${{ secrets.AZURE_VM_USER }}/docker-compose.yml
      - name: Copy setup script to VM
        run: scp -o StrictHostKeyChecking=no scripts/setup-java-docker.sh ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_HOST_VM }}:/home/${{ secrets.AZURE_VM_USERNAME }}/setup-java-docker.sh

      - name: Run setup script on VM
        run: ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_HOST_VM }} "bash /home/${{ secrets.AZURE_VM_USER }}/setup-java-docker.sh"

      - name: Copy .env file to Azure VM
        run: |
         scp -o StrictHostKeyChecking=no .env \
         ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_HOST_VM }}:/home/${{ secrets.AZURE_VM_USER }}/.env

      - name: Deploy using Docker Compose
        run: |
            ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_HOST_VM }} << 'EOF'
              cd /home/${{ secrets.AZURE_VM_USERNAME }}
              docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
              docker compose --env-file .env -f docker-compose.yml down || true
              docker compose --env-file .env -f docker-compose.yml up -d --pull always
            EOF








