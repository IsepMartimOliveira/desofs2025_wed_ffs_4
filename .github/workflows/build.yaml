name: Java Build, Package, and Docker Image

on:
  release:
    types: [published]
env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE_NAME: 'fake-spotify'


jobs:
  build-jar:
    name: Build and Package JAR
    runs-on: ubuntu-latest
    outputs:
      jar-path: ${{ steps.upload-artifact.outputs.artifact-path }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven

      - name: Build and package the project
        run: mvn clean package -DskipTests

      - name: Upload JAR as artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  push_to_registry:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-jar
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Download JAR artifact from build-jar job
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      - name: List downloaded artifact contents
        run: ls -l app-jar/

      - name: Move JAR to target directory for Docker build
        run: |
          mkdir -p target
          mv app-jar/*.jar target/

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
