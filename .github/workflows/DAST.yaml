name: DAST OWASP ZAP Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    env:
      DB_URL: ${{secrets.DB_URL}}${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_IMAGE_NAME: 'spotify-copy'
      VERSION: 'latest'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull latest image
        run: docker pull $DOCKER_USERNAME/$DOCKER_IMAGE_NAME:$VERSION

      - name: Build and start services
        run: docker compose up -d

      - name: Wait for services to be healthy
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q app))
            echo "App status: $status"
            if [ "$status" = "healthy" ]; then
              echo "App is healthy!"
              break
            fi
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "App did not become healthy in time."
              docker compose logs
              exit 1
            fi
          done

      - name: Run OWASP ZAP scan
        run: |
          docker run --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap_report.html

      - name: Upload ZAP Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

      - name: Tear down services
        run: docker compose down --volumes