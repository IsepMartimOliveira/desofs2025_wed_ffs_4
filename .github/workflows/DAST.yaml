name: DAST OWASP ZAP Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE_NAME: 'spotify-copy'
      VERSION: 'latest'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build JAR with Maven
        run: ./mvnw clean package -DskipTests

      - name: Create .env file from secrets
        run: |
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker compose --env-file .env build

      - name: Start services
        run: docker compose --env-file .env up -d

      - name: Wait for app to be healthy
        run: |
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q app))
            echo "App status: $status"
            if [ "$status" = "healthy" ]; then
              echo "App is healthy!"
              break
            fi
            sleep 10
            if [ "$i" -eq 30 ]; then
              echo "App did not become healthy in time."
              docker compose logs
              exit 1
            fi
          done

      - name: Run OWASP ZAP scan
        run: |
          docker run --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            owasp/zap2docker-stable zap-baseline.py \
            -t http://localhost:8080 \
            -r zap_report.html

      - name: Upload ZAP Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap_report.html

      - name: Tear down services
        run: docker compose --env-file .env down --volumes

      - name: Clean up .env
        run: rm -f .env
