name: DAST OWASP ZAP Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dast-scan:
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:postgresql://db:5432/${{ secrets.DB_NAME }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Pull published image
        run: docker pull ${{ secrets.DOCKER_USERNAME }}/spotify-copy:latest
      - name: Start containers with Compose
        run: docker compose up -d

      - name: Display logs for debugging
        run: |
          echo "Container status:"
          docker compose ps
          echo "Application logs:"
          docker compose logs app

      - name: Wait for the app to be ready
        run: |
          echo "Waiting for application to start..."
          timeout=120
          counter=0
          while ! curl -s http://localhost:8080 > /dev/null; do
            if [ $counter -ge $timeout ]; then
              echo "Timed out waiting for application to start"
              docker compose logs app
              exit 1
            fi
            echo "Still waiting... ($counter seconds elapsed)"
            sleep 5
            counter=$((counter + 5))
          done
          echo "Application is up and running!"

      - name: Run OWASP ZAP scan
        uses: zaproxy/action-baseline@v0.8.0
        with:
          target: 'http://localhost:8080'
          failOnRisk: 'high'

      - name: Stop containers
        if: always()
        run: docker compose down