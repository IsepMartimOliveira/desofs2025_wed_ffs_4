name: DAST OWASP ZAP Scan

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Write application-passwords.properties file
        run: |
          echo "${{ secrets.APPLICATION_PASSWORDS }}" > src/main/resources/application-passwords.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Spring Boot app
        run: ./mvnw clean package -DskipTests

      - name: Run Spring Boot app in background
        run: |
          nohup java -jar target/demoOrm-0.0.1-SNAPSHOT.jar &
          sleep 30  # wait for app startup

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.8.0
        with:
          target: 'http://localhost:8080'  # change if your app runs on different port or URL
          failOnRisk: 'high'
          rulesFileName: '.zap/rules.txt'  # optional

      - name: Kill Spring Boot app
        run: |
          pkill -f 'java -jar'
