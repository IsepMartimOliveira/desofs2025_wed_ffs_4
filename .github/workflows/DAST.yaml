name: DAST Scan on PR

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  dast-scan:
    name: Run OWASP ZAP DAST Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build  app
        run: mvn clean package -DskipTests

      - name: Run the app in background
        run: |
          java -jar target/*.jar &
          echo $! > pid.txt
          sleep 20  # wait for app to be ready

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'http://localhost:8080'
          format: 'sarif'
          output: 'zap_report.sarif'
          failOnError: true

      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: zap_report.sarif

      - name: Stop the app
        run: kill $(cat pid.txt)
